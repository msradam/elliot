[project]
name = "elliot"
version = "0.1.0"
description = "An LLM-driven state machine in control of a simulated robot."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "theodosia>=0.4.2",
    "apache-burr>=0.42.0",
    "ir-sim>=2.10.0",
    "litellm>=1.88.0",
    "fastmcp>=3.4.0",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
elliot = "elliot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elliot"]

[tool.hatch.build.targets.wheel.force-include]
"elliot/worlds" = "elliot/worlds"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["UP", "FURB", "I"]

[tool.refurb]
# FURB124 (chained `is`) and FURB140 (starmap) read worse than the explicit form.
ignore = [124, 140]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
